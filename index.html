<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏厅</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="游戏厅">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1e20">
<style>
:root{--bg:#1e1e20;--panel:#2a2a2d;--line:#3a3a3e;--ink:#ecebe7;--dim:#9a9994;--acc:#e08a6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:320px;text-align:center}
img{width:72px;height:72px;image-rendering:pixelated;border-radius:16px}
h1{font-size:20px;margin:14px 0 4px;letter-spacing:2px;font-weight:600}
p{color:var(--dim);font-size:13px;margin:0 0 20px}
input[type=password]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--ink);font-size:16px;text-align:center;outline:none}
input[type=password]:focus{border-color:var(--acc)}
button{display:block;width:100%;background:var(--acc);color:#1e1e20;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;margin-top:12px}
button:disabled{opacity:.5}
label{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:13px;margin-top:14px}
label input{accent-color:var(--acc);width:16px;height:16px}
.err{color:var(--acc);min-height:20px;margin-top:10px;font-size:13px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
</style>
</head>

const K = "arcade_pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(PACK.salt), iterations: PACK.iter },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PACK.iv) }, key, b64(PACK.data));
  return new TextDecoder().decode(buf);
}
function show(html) { document.open(); document.write(html); document.close(); }
function get() { try { return localStorage.getItem(K); } catch (e) { return null; } }
function put(v) { try { v ? localStorage.setItem(K, v) : localStorage.removeItem(K); } catch (e) {} }

const saved = get();
if (saved) open(saved).then(show).catch(() => put(null));

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, btn = document.getElementById("go"), err = document.getElementById("err");
  if (!pw) return;
  btn.disabled = true; err.textContent = "";
  try {
    const html = await open(pw);
    put(document.getElementById("keep").checked ? pw : null);
    show(html);
  } catch (x) {
    err.textContent = "暗号不对。";
    const f = document.getElementById("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    btn.disabled = false;
  }
};

// 有新版本时：还停在门口就自动刷新；已经在玩了就不打扰，下次打开再换
if ("serviceWorker" in navigator) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && document.getElementById("f")) location.reload(); });
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
}
})();
</script>
